name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Линт
        run: npm run lint

      - name: Сборка клиента в актуальном состоянии
        run: npm run check:client

      - name: Тесты
        run: npm test

  coverage:
    name: Покрытие (порог)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Зависимости
        run: npm ci

      # Пороги с запасом к текущему уровню (lines 92%, branches 81%):
      # падение ниже — сигнал о непокрытой новой логике, а не о шуме.
      - name: Покрытие с порогом
        run: npx c8 --include "lib/**" --include "src/**" --include "scripts/**" --reporter text --lines 90 --branches 80 npm test
