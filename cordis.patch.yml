# dsh-voice-chat 组合包补丁：把语音对话插件行插入 profile。
# 宿主半身加载 dsh-voice-chat 包；浏览器半身由 dsh.client + exports["./client"] 自动发现。
#
# ⚙️ 配置方法：在【你自己的 profile 配置文件】里按 id 覆盖本行 config，例如
#   编辑 ~/.dsh/profiles/web/cordis.patch.yml，追加：
#
#   - id: dsh-voice-chat
#     name: 'dsh-voice-chat'
#     config:
#       # Настройки распознавания речи
#       asrEngine: siliconflow          # siliconflow | groq | mimo | custom | browser | local（речь в текст）
#       asrApiKey: sk-xxxx              # ASR ключ (старый формат: действует на текущий движок; или переменная окружения DSH_VOICE_ASR_KEY)
#       asrBaseUrl: https://api.siliconflow.cn/v1
#       asrModel: FunAudioLLM/SenseVoiceSmall
#       asr:                            # Конфигурация ASR по движкам (приоритет над плоскими ключами выше)
#         local:  { baseUrl: http://127.0.0.1:8765/v1, model: small }   # офлайн faster-whisper (tiny|base|small|medium|large-v3)
#         custom: { baseUrl: https://your-host/v1, model: whisper-v3, apiKey: sk-xxxx }
#       llmModel: deepseek-v4-flash     # Модель для пересказа ответов (использует LLM из harness, ключ не нужен; опционально deepseek-v4-pro)
#       silenceMs: 2500                 # Через сколько миллисекунд тишины автоматически завершить запись
#       continuousMode: false           # «Постоянный диалог»: микрофон включается сам, речь перебивает озвучку
#       # Настройки озвучивания
#       rewrite: true                   # Использовать LLM для пересказа ответа перед озвучиванием
#       ttsEngine: edge                 # TTS движок: edge (Microsoft Edge TTS, бесплатно) | mimo | custom (пользовательский TTS, OpenAI-совместимый API) | browser (speechSynthesis) | local (Piper, офлайн)
#       voice: ru-RU-SvetlanaNeural     # Голос Edge (эквивалентно tts.edge.voice)
#       ttsBaseUrl: https://api.openai.com/v1  # Старый формат: действует на текущий движок (обязательно при ttsEngine=custom)
#       ttsModel: tts-1                 # Старый формат: имя модели
#       ttsApiKey: sk-xxxx              # Старый формат: ключ
#       tts:                            # Конфигурация TTS по движкам (приоритет над плоскими ключами выше)
#         edge:   { voice: ru-RU-SvetlanaNeural }
#         local:  { baseUrl: http://127.0.0.1:8765/v1, model: piper, voice: ru_RU-irina-medium }
#         mimo:   { baseUrl: https://api.xiaomimimo.com/v1, model: mimo-v2.5-tts, apiKey: sk-xxxx, voice: 冰糖 }
#         custom: { baseUrl: https://api.openai.com/v1, model: tts-1, apiKey: sk-xxxx, voice: alloy }
#       rate: '+10%'                    # Скорость речи ('+15%' быстрее, '+0%' обычная)
#       ratePercent: 110                # Скорость речи в процентах (50-200, 100 = нормальная)
#       speechLang: ru-RU               # Язык озвучки (ru-RU | zh-CN | en-US | ja-JP)
#       shortTextChars: 50              # Ответы короче этого количества символов озвучиваются как есть, без пересказа
#
# Подсказка: ASR/TTS для каждого движка хранит свою конфигурацию (asr.<движок> / tts.<движок>), переключение
# движков не перезаписывает настройки друг друга; старые плоские ключи совместимы (действуют только
# на текущий выбранный движок). Панель настроек (settings.local.json) имеет приоритет
# над этим файлом.
#
# Если не менять конфигурацию, используются значения по умолчанию (указаны в комментариях выше).
- insert:
    - id: dsh-voice-chat
      name: 'dsh-voice-chat'
      config: {}
